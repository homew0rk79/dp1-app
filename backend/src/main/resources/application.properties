spring.application.name=tasf-b2b-backend
server.port=8080

# ── Rutas a los archivos de datos ─────────────────────────────────────────────
# Relativas al directorio de trabajo del JVM (raíz del proyecto al ejecutar con Maven).
# Cámbielas según la ubicación real de los archivos en tu equipo.
tasf.datos.aeropuertos=../docs/data/c.1inf54.26.1.v1.Aeropuerto.husos.v1.20250818__estudiantes.txt
tasf.datos.vuelos=../docs/data/planes_vuelo.txt
tasf.datos.envios=../docs/data/_envios_preliminar_

# ── Parámetros del algoritmo Tabu Search ──────────────────────────────────────
tasf.algoritmo.iteraciones=200
tasf.algoritmo.tenencia=30
tasf.algoritmo.muestra=200

# ── DIA_A_DIA ─────────────────────────────────────────────────────────────────
# Iteraciones para la planificación INICIAL del escenario día a día
# (más rápida que el PERIODO para no demorar el arranque del reloj en vivo)
tasf.algoritmo.iteraciones.diaadia.inicial=50

# Ta: cada cuántos minutos REALES se replanifica en día a día (1 min para demo fluida)
tasf.diaadia.intervalo-minutos=1
# Sa: horas SIMULADAS que avanza cada bloque de replanificación
tasf.diaadia.bloque-horas-simuladas=5
tasf.colapso.dias-busqueda=14
tasf.simulacion.sc-salto-consumo-min=60

# ── Semáforo de cumplimiento de plazos (porcentaje) ───────────────────────────
tasf.semaforo.umbral-verde=90.0
tasf.semaforo.umbral-ambar=70.0

# ── CORS ──────────────────────────────────────────────────────────────────────
tasf.cors.origins=http://localhost:5173,http://localhost:3000,http://1inf54-984-6f.inf.pucp.edu.pe

# Carga manual de archivos .txt desde la interfaz administrativa.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tasfb2b}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tasfb2b_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
