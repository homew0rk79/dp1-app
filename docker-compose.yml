services:
  postgres:
    image: postgres:16-alpine
    container_name: tasfb2b-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasfb2b
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dp1tasfb2b
    ports:
      - "5432:5432"
    volumes:
      - tasfb2b_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasfb2b"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tasfb2b_postgres_data:
